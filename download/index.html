<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멈칫 다운로드</title>
<meta name="description" content="사진 한 장과 금액, 태그로 남기는 소비일기 · 사진 가계부 앱이에요. 무료 · 로그인 없음 · 기록은 휴대폰 안에만 저장해요.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mumchit.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="멈칫 - 소비일기, 사진 가계부">
<meta property="og:description" content="사진 한 장과 금액, 태그로 남기는 소비일기 · 사진 가계부 앱. 무료 · 로그인 없음 · 기록은 휴대폰 안에만.">
<meta property="og:url" content="https://mumchit.github.io/download/">
<style>
  :root{ --ink:#1f3b2c; --body:#5f6368; --green:#3d6b50; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; padding:24px 20px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    color:var(--ink); background:#f4f3ef; line-height:1.6; -webkit-text-size-adjust:100%; text-align:center;
  }
  main{max-width:460px; width:100%;}
  h1{font-size:40px; font-weight:800; letter-spacing:-1.5px; line-height:1.25; margin:0 0 18px;}
  .note{color:var(--body); font-size:17px; line-height:1.65; margin:0 0 30px; word-break:keep-all;}
  .btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  a.btn{
    display:inline-block; text-decoration:none;
    background:var(--green); color:#fff; border-radius:14px; padding:16px 26px;
    font-size:18px; font-weight:700; letter-spacing:-0.3px;
  }
  .home{display:inline-block; margin-top:30px; color:var(--body); font-size:16px;}
  @media (prefers-color-scheme: dark){
    body{background:#111113; color:#eef3ef;}
    .note,.home{color:#a9a9b0;}
    a.btn{background:#4f8a68;}
  }
</style>
</head>
<body>
<main>
  <h1>멈칫 다운로드</h1>
  <p class="note" id="note">사진으로 남기는 소비일기 · 사진 가계부 앱입니다.<br>쓰시는 휴대폰의 스토어를 골라 받을 수 있습니다.</p>
  <div class="btns">
    <a class="btn" id="ios" href="https://apps.apple.com/kr/app/id6808496646">App Store</a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.woobiz.mumchit">Google Play</a>
  </div>
  <a class="home" href="../">멈칫 홈페이지</a>
</main>
<script>
(function () {
  // 광고 꼬리표: ?from=insta → 플레이에는 utm_source로 넘긴다(플레이 콘솔 획득 보고서에 잡힌다).
  // 애플은 캠페인 링크에 제공자 토큰(pt)이 있어야 잡힌다 — 받으면 APPLE_PT에 넣는다.
  var APPLE_PT = '';
  var q = new URLSearchParams(location.search);
  var from = (q.get('from') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);

  var ios = 'https://apps.apple.com/kr/app/id6808496646';
  if (from && APPLE_PT) ios += '?pt=' + APPLE_PT + '&ct=' + from + '&mt=8';
  var android = 'https://play.google.com/store/apps/details?id=com.woobiz.mumchit';
  if (from) android += '&referrer=' + encodeURIComponent('utm_source=' + from + '&utm_medium=landing');

  document.getElementById('ios').href = ios;
  document.getElementById('android').href = android;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var target = isIOS ? ios : isAndroid ? android : null;
  if (target) {
    document.getElementById('note').innerHTML = '잠시 후 다운로드 페이지로 이동합니다.<br>자동으로 이동하지 않으면 아래 버튼으로 이동할 수 있습니다.';
    setTimeout(function () { location.href = target; }, 600);
  }
})();
</script>
</body>
</html>
