<style>
  :root{ --ink:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93; --green:#3d6b50; --hair:#e6e6ea; --parch:#f7f7f9; }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:96px 20px;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;

  .links{display:flex; flex-direction:column; gap:10px;}
  a.card{
    display:block; text-decoration:none; color:inherit;
    background:var(--parch); border-radius:14px; padding:18px 20px;
  }
  a.card .t{font-size:16px; font-weight:700; letter-spacing:-0.3px;}
  a.card .d{font-size:13.5px; color:var(--faint); margin-top:2px;}
  footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--hair); font-size:13.5px; color:var(--muted);}
  footer a{color:var(--green);}
  @media (prefers-color-scheme: dark){
    body{background:#111113; color:#f2f2f5;}
    .tagline{color:#a9a9b0;}
    a.card{background:#1c1c1f;}
    a.card .d{color:#8e8e96;}
    footer{border-top-color:#2c2c31; color:#a9a9b0;}
    footer a{color:#8fc0a4;}
